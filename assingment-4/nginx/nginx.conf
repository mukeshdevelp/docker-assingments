events {
    worker_connections 1024;
}

http {
    # DNS resolver for dynamic service discovery
    resolver 127.0.0.11 valid=10s;

    # Client timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Load balancing for high availability - Step 4
    upstream attendance {
        # Use service name for load balancing across replicas
        server attendance:8081;
    }

    upstream employee {
        # Use service name for load balancing across replicas
        server employee:8083;
    }

    upstream salary {
        # Use service name for load balancing across replicas
        server salary:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy for Attendance service with load balancing
        # Services expect full path: /attendance/healthz
        # Note: Healthz endpoint connects to MySQL which can be slow, so timeouts are increased
        # proxy_pass without trailing slash preserves full URI path
        location /attendance/ {
            proxy_pass http://attendance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # Proxy for Employee service with load balancing
        # Services expect full path: /employee/healthz, so preserve the path
        # Note: Employee service creates Elasticsearch index on first request, which can take time
        location /employee/ {
            proxy_pass http://employee;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;      # Increased for Elasticsearch index creation
            proxy_read_timeout 180s;     # Increased for Elasticsearch index creation
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # Proxy for Salary service with load balancing
        # Services expect full path: /salary/search/all, so preserve the path
        location /salary/ {
            proxy_pass http://salary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # Default location
        location / {
            return 404;
        }
    }
}

