# Assignment 4: OT-Microservices with High Availability
# Step 1: Clone code and run (code is cloned inside Dockerfiles during build)
# Step 2: Delete local code - services run from images (no local code needed)
# Step 3: Buddy can run without cloning - only needs docker-compose.yml and Dockerfiles
# Step 4: High Availability - use: docker-compose up --scale attendance=2 --scale employee=2 --scale salary=2
version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: otmicroservices
      MYSQL_USER: otuser
      MYSQL_PASSWORD: otpassword
    ports:
      - "3307:3306"  # Changed to 3307 to avoid conflict with existing MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Step 4: Attendance Service - Highly Available (use --scale attendance=2)
  attendance:
    build:
      context: .
      dockerfile: dockerfiles/attendance/Dockerfile
    image: ot-attendance:latest
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: otmicroservices
      MYSQL_USER: otuser
      MYSQL_PASSWORD: otpassword
      SERVER_PORT: 8081
      CONFIG_FILE: "/app/config/config.yaml"
    # Port mapping removed for high availability (access via nginx on port 8000)
    # ports:
    #   - "8081:8081"
    networks:
      - ot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "10", "http://localhost:8081/attendance/healthz"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  # Step 2: Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: ot-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Step 4: Employee Service - Highly Available (use --scale employee=2)
  employee:
    build:
      context: .
      dockerfile: dockerfiles/employee/Dockerfile
    image: ot-employee:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      SERVER_PORT: 8083
      CONFIG_FILE: "/root/config/config.yaml"
    # Port mapping removed for high availability (access via nginx on port 8000)
    # ports:
    #   - "8083:8083"
    networks:
      - ot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/employee/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Step 4: Salary Service - Highly Available (use --scale salary=2)
  salary:
    build:
      context: .
      dockerfile: dockerfiles/salary/Dockerfile
    image: ot-salary:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
      employee:
        condition: service_started
      attendance:
        condition: service_started
    environment:
      EMPLOYEE_SERVICE_URL: http://employee:8083
      ATTENDANCE_SERVICE_URL: http://attendance:8081
      SERVER_PORT: 8080
      CONFIG_FILE: "/root/config/config.yaml"
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_REST_USERNAME: ""
      SPRING_ELASTICSEARCH_REST_PASSWORD: ""
    # Port mapping removed for high availability (access via nginx on port 8000)
    # ports:
    #   - "8080:8080"
    networks:
      - ot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/salary/search/all"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy with Load Balancing
  nginx:
    build:
      context: .
      dockerfile: dockerfiles/nginx/Dockerfile
    image: ot-nginx:latest
    container_name: ot-nginx
    depends_on:
      salary:
        condition: service_started
      employee:
        condition: service_started
      attendance:
        condition: service_started
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: dockerfiles/frontend/Dockerfile
    image: ot-frontend:latest
    depends_on:
      - nginx
    environment:
      REACT_APP_API_URL: http://nginx:80
    ports:
      - "3000:3000"
    networks:
      - ot-network

networks:
  ot-network:
    driver: bridge

volumes:
  mysql-data:
  es-data:

